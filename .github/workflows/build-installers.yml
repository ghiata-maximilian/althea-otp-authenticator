name: Build Althea OTP Authenticator Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk python3-cryptography python3-venv dpkg-dev
      
      - name: Build Linux binary with PyInstaller
        run: |
          python3 -m pip install --user pyinstaller
          ~/.local/bin/pyinstaller --onefile --name authenticator \
            --add-data "olympus-authenticator.png:." \
            --icon olympus-authenticator.png \
            olympus_authenticator.py
      
      - name: Create .deb package
        run: |
          mkdir -p deb-package/DEBIAN deb-package/usr/bin deb-package/usr/share/applications deb-package/usr/share/icons/hicolor/256x256/apps
          cp dist/authenticator deb-package/usr/bin/authenticator
          cat > deb-package/DEBIAN/control << 'EOF'
Package: authenticator
Version: 1.1.0
Section: utils
Priority: optional
Architecture: amd64
Depends: python3, python3-tk, python3-cryptography
Maintainer: Althea AI <admin@althea-ai.pro>
Description: Modern offline TOTP authenticator
EOF
          dpkg-deb --build deb-package authenticator_1.1.0_amd64.deb
      
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            authenticator
            authenticator_1.1.0_amd64.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller cryptography
      
      - name: Build Windows executable with PyInstaller
        run: |
          pyinstaller --onefile --name authenticator --icon=olympus-authenticator.ico --add-data "olympus-authenticator.png;." olympus_authenticator.py
      
      - name: Create Inno Setup installer
        run: |
          # Inno Setup is pre-installed on Windows runners
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" install_windows.iss
      
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            dist/authenticator.exe
            Althea_OTP_Authenticator_Setup_1.1.0.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller cryptography
      
      - name: Build macOS app with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "Althea OTP Authenticator" --icon=olympus-authenticator.icns --add-data "olympus-authenticator.png:." olympus_authenticator.py
      
      - name: Create .app bundle
        run: |
          mkdir -p "Althea OTP Authenticator.app/Contents/MacOS"
          mkdir -p "Althea OTP Authenticator.app/Contents/Resources"
          cp dist/althea-otp-authenticator "Althea OTP Authenticator.app/Contents/MacOS/Althea OTP Authenticator"
          cat > "Althea OTP Authenticator.app/Contents/Info.plist" << 'EOF'
  <?xml version="1.0" encoding="UTF-8"?>
  <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
  <plist version="1.0">
  <dict>
    <key>CFBundleExecutable</key><string>Althea OTP Authenticator</string>
    <key>CFBundleIconFile</key><string>authenticator.icns</string>
    <key>CFBundleIdentifier</key><string>pro.althea-ai.authenticator</string>
    <key>CFBundleName</key><string>Althea OTP Authenticator</string>
    <key>CFBundlePackageType</key><string>APPL</string>
    <key>CFBundleShortVersionString</key><string>1.1.0</string>
    <key>CFBundleVersion</key><string>1.1.0</string>
    <key>LSHighResolutionCapable</key><true/>
  </dict>
  </plist>
  EOF
          cp olympus-authenticator.png "Althea OTP Authenticator.app/Contents/Resources/icon.icns"
      
      - name: Create DMG
        run: |
          hdiutil create -volname "Althea OTP Authenticator" -srcfolder "Althea OTP Authenticator.app" -ov -format UDZO "Althea_OTP_Authenticator-1.1.0.dmg"
      
      - name: Create PKG installer
        run: |
          pkgbuild --root . --component "Althea OTP Authenticator.app" --install-location /Applications --identifier "pro.althea-ai.authenticator" --version "1.1.0" --ownership recommended "Althea_OTP_Authenticator-1.1.0.pkg"
      
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            Althea_OTP_Authenticator-1.1.0.dmg
            Althea_OTP_Authenticator-1.1.0.pkg

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-installers
          path: linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: macos
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            linux/authenticator
            linux/authenticator_1.1.0_amd64.deb
            windows/authenticator.exe
            windows/Althea_OTP_Authenticator_Setup_1.1.0.exe
            macos/Althea_OTP_Authenticator-1.1.0.dmg
            macos/Althea_OTP_Authenticator-1.1.0.pkg
